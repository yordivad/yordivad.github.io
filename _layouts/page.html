---
layout: default
---
<div class="shell">
  <div class="{% if page.wide %}wide{% else %}prose{% endif %}">
    <header class="page-head">
      {%- if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif -%}
      <h1>{{ page.title }}</h1>
      {%- if page.subtitle %}<p class="lede muted">{{ page.subtitle }}</p>{% endif -%}
    </header>
    {{ content }}
  </div>
</div>
